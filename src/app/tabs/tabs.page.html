<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Cinepholia</ion-title>
  </ion-toolbar>
</ion-header>
<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button
      tab="upcoming-booking"
      [routerLink]="['/tabs/upcoming-booking']"
    >
      <ion-icon name="calendar"></ion-icon>
      <ion-label>Bookings</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="profile" [routerLink]="['/tabs/profile']">
      <ion-icon name="person"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
